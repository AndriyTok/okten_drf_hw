server {
    listen 80;  # Порт, на якому Nginx приймає HTTP-запити
    server_name localhost;  # Ім'я сервера, для якого застосовуються ці налаштування

    index index.html;  # Файл, який використовується як головна сторінка
    root /usr/share/nginx/html;  # Коренева директорія зі статичними файлами frontend

    client_max_body_size 20M;  # Максимальний розмір тіла HTTP-запиту — 20 МБ

    location / {
        # Спробувати знайти відповідний файл або директорію;
        # якщо нічого не знайдено — повернути index.html
        try_files $uri$args $uri$args/ /index.html;
    }

    location /api/ {
        # Перенаправляти API-запити на Django-контейнер app
        proxy_pass http://app:8000/;

        # Передавати оригінальний Host у запиті до Django
        proxy_set_header Host $host;
    }
}