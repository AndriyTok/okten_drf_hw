services:
  app:
    build:
      context: . # Використовуємо поточну директорію як контекст для збирання Docker-образу
    volumes:
      - ./backend:/app
    env_file:
      - .env
    ports:
      - "8888:8000"
    restart: on-failure
    command: >
      sh -c "python manage.py wait_db &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"


  db:
    image: mysql:8.4
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    restart: on-failure


  web:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./client:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf